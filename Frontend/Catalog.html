<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - Nkwen Traders</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/catalog.css">
</head>
<body>

    <!-- Sidebar Navigation for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeSidebarBtn" aria-label="Close menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <nav class="sidebar-nav">
            <a href="index.html">Home</a>
            <a href="Catalog.html" class="active">Products</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </aside>

    <!-- Header Section -->
    <header id="mainHeader" style="background-color: var(--clr-dark-bg);">
        <div class="container header-container">
            <a href="index.html" class="logo">NkweN Traders</a>
            
            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="Catalog.html" class="active">Products</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </nav>

            <div class="header-actions">
                <a href="#" class="cart-btn" aria-label="Shopping Cart" style="position:relative; display:inline-flex;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span style="position:absolute; top:-6px; right:-10px; background-color:var(--clr-accent); color:var(--clr-dark-bg); font-size:10px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; letter-spacing: -0.5px;">3</span>
                </a>
                <button class="hamburger-btn" id="openSidebarBtn" aria-label="Open menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Catalog Section -->
    <main class="catalog-main">
        <div class="container catalog-container">
            
            <!-- Sidebar Filter -->
            <aside class="catalog-sidebar">
                <h3 class="sidebar-title">Categories</h3>
                
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="Search products...">
                </div>

                <ul class="category-list">
                    <!-- Categories will be injected here via JavaScript -->
                </ul>

                <div class="price-filter">
                    <h4 class="filter-title">FILTER BY PRICE</h4>
                    <div class="slider-container">
                        <input type="range" min="0" max="40000" value="40000" class="price-slider" id="priceSlider" aria-label="Price Filter">
                    </div>
                    <div class="price-labels">
                        <span>0 FCFA</span>
                        <span id="priceLabel">40000 FCFA</span>
                    </div>
                </div>
            </aside>

            <!-- Main Product Area -->
            <section class="catalog-content">
                <div class="catalog-header">
                    <div class="header-titles">
                        <h2>All Products</h2>
                        <p>Showing 1-12 of 148 results</p>
                    </div>
                    <div class="sort-by">
                        <label>Sort by:</label>
                        <div class="custom-select">
                            <select aria-label="Sort products">
                                <option>Featured</option>
                                <option>Price: Low to High</option>
                                <option>Price: High to Low</option>
                                <option>Newest Arrivals</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="catalog-grid" id="catalogGrid">
                    <!-- Products will be injected here via JavaScript -->
                </div>

                <div class="pagination">
                    <button class="page-nav" aria-label="Previous page">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <button class="page-num active">1</button>
                    <button class="page-num">2</button>
                    <button class="page-num">3</button>
                    <span class="page-dots">...</span>
                    <button class="page-num">12</button>
                    <button class="page-nav" aria-label="Next page">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-container">
            <div class="footer-left">
                <a href="index.html" class="logo">NkweN Traders</a>
                <p>&copy; 2026 Nkwen Traders. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Shipping Info</a>
            </div>
        </div>
    </footer>

    <script src="Js/index.js"></script>
    <script src="Js/catalog.js"></script>
</body>
</html>
